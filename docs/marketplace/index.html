<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baseline for Obsidian</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="../main.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-38V3HD97K9"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-38V3HD97K9");
    </script>
  </head>
  <body>
    <div class="header">
      <div class="header-title">
        <h1>
          <a href=".."><i data-lucide="chevron-left"></i>Baseline for Obsidian</a><span>/</span>
        </h1>
        <h1>Marketplace</h1>
      </div>
      <div class="header-actions">
        <a href="https://github.com/aaaaalexis/obsidian-baseline/blob/main/docs/marketplace/README.md" class="submit-btn">
          <button><i data-lucide="upload"></i>Submit</button>
        </a>
        <a href="https://github.com/aaaaalexis/obsidian-baseline" class="header-link">View Baseline on GitHub</a>
        <button class="mode-btn" data-mode="light">
          <i class="mode-icon" data-lucide="sun"></i>
        </button>
      </div>
    </div>
    <div class="content">
      <div class="setting-container" title='Click the "Import" button in Style Settings to import copied or downloaded style presets.'>
        <div class="setting">
          <div class="setting-sidebar">
            <div class="sidebar-section">
              <div class="sidebar-title">Community plugins</div>
              <div class="sidebar-link is-active">Style Settings</div>
            </div>
          </div>
          <div class="setting-content">
            <div class="setting-header">
              <div class="setting-search">
                <i data-lucide="search"></i>
                Search Style Settings...
              </div>
              <div class="setting-actions">
                <button>Import</button>
                <button>Export</button>
              </div>
            </div>
            <div class="setting-list">
              <div class="setting-item">
                <i data-lucide="chevron-right"></i>
                <div class="setting-item-name">Baseline</div>
                <div class="setting-item-actions"><i data-lucide="rotate-ccw"></i><i data-lucide="cloud-download"></i></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <p>Choose your favorite style preset, copy or download it, then import into Style Settings.</p>
      <div class="preset-actions">
        <input type="search" class="preset-search" placeholder="Search style presets..." />
        <button class="preset-filter"><i data-lucide="filter"></i>New to old</button>
      </div>
      <div class="panel-container"></div>
      <div class="lightbox-overlay" aria-hidden="true">
        <img class="lightbox-img" />
        <p class="lightbox-title"></p>
      </div>
    </div>

    <script src="https://unpkg.com/lucide@latest" onload="lucide.createIcons()"></script>
    <script src="../mode.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const fetchJSON = async (path) =>
          fetch(path)
            .then((r) => (r.ok ? r.json() : null))
            .catch(() => null);
        const mdLinks = (t) => (t ? t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>') : "No description available.");

        const isDark = () => {
          const s = localStorage.getItem("colorMode");
          return s ? s === "dark" : window.matchMedia?.("(prefers-color-scheme: dark)").matches;
        };

        const pickSrc = (img) => {
          const { light, dark, base } = img.dataset;
          return isDark() ? dark || light || base : light || dark || base;
        };

        const loadAndReveal = (picture) => {
          const img = picture.querySelector("img");
          if (!img) return;
          const src = pickSrc(img);
          if (!src) return picture.classList.remove("loading");

          const loader = new Image();
          loader.onload = () => {
            img.src = src;
            requestAnimationFrame(() => {
              img.style.opacity = "1";
              picture.classList.remove("loading");
            });
          };
          loader.onerror = () => picture.classList.remove("loading");
          loader.src = src;
        };

        // UI Elements
        const container = document.querySelector(".panel-container");
        const searchInput = document.querySelector(".preset-search");
        const filterBtn = document.querySelector(".preset-filter");
        const overlay = document.querySelector(".lightbox-overlay");
        const lightboxImg = overlay?.querySelector(".lightbox-img");
        const lightboxThemeName = overlay?.querySelector(".lightbox-title");

        // State
        let items = [];
        const presetDetails = {};
        const modes = ["new", "old", "a-z", "z-a"];
        const labels = { new: "New to old", old: "Old to new", "a-z": "A to Z", "z-a": "Z to A" };
        let modeIndex = 0;
        let openedPicture = null;

        const updateFilterLabel = () => {
          filterBtn.innerHTML = `<i data-lucide="filter"></i>${labels[modes[modeIndex]]}`;
          lucide.createIcons();
        };

        const render = () => {
          const q = searchInput.value.trim().toLowerCase();
          let list = [...items];
          const mode = modes[modeIndex];

          if (mode === "new") list.reverse();
          else if (mode === "a-z") list.sort((a, b) => a.name.localeCompare(b.name));
          else if (mode === "z-a") list.sort((a, b) => b.name.localeCompare(a.name));

          if (q) list = list.filter((i) => i.searchable.includes(q));

          container.innerHTML = list.map((i) => i.html).join("");
          lucide.createIcons();
          container.querySelectorAll(".preset-panel picture").forEach(loadAndReveal);
        };

        // Event Delegation for container (Copy, Download, Lightbox)
        container.addEventListener("click", (e) => {
          const btn = e.target.closest("button");
          const panel = e.target.closest(".preset-panel");
          const picture = e.target.closest(".preset-panel picture");

          if (panel && btn?.closest(".copy-btn")) {
            const presetId = panel.dataset.preset;
            const details = presetDetails[presetId];
            if (!details) return;
            navigator.clipboard.writeText(JSON.stringify(details, null, 2)).then(() => {
              const orig = btn.innerHTML;
              btn.innerHTML = "Copied!";
              setTimeout(() => {
                btn.innerHTML = orig;
                lucide.createIcons();
              }, 1000);
              window.gtag?.("event", "preset_copy", { preset: presetId });
            });
          } else if (panel && btn?.closest(".download-btn")) {
            window.gtag?.("event", "preset_download", { preset: panel.dataset.preset });
          } else if (picture && overlay) {
            const img = picture.querySelector("img");
            if (img) openLightbox(pickSrc(img), picture, panel.querySelector("h2")?.textContent);
          }
        });

        // Search & Filter
        let debounce;
        searchInput.addEventListener("input", () => {
          clearTimeout(debounce);
          debounce = setTimeout(() => {
            const val = searchInput.value.trim();
            const url = new URL(window.location);
            val ? url.searchParams.set("q", val) : url.searchParams.delete("q");
            window.history.replaceState({}, "", url);
            render();
          }, 150);
        });

        filterBtn.addEventListener("click", () => {
          modeIndex = (modeIndex + 1) % modes.length;
          updateFilterLabel();
          render();
        });

        // Lightbox functionality
        const openLightbox = (src, picture, title) => {
          overlay.classList.remove("hidden");
          lightboxImg.src = src;
          overlay.classList.add("active");
          lightboxThemeName.textContent = title || "";
          picture.classList.add("opened");
          openedPicture = picture;
        };

        const closeLightbox = () => {
          if (!overlay.classList.contains("active")) return;
          overlay.classList.remove("active");

          if (openedPicture) {
            openedPicture.classList.remove("opened");
            openedPicture = null;
          }

          const handler = () => {
            overlay.classList.add("hidden");
            lightboxImg.src = "";
            lightboxThemeName.textContent = "";
            lightboxImg.removeEventListener("transitionend", handler);
          };
          lightboxImg.addEventListener("transitionend", handler);
        };

        overlay?.addEventListener("click", (e) => {
          if (e.target === overlay || e.target === lightboxImg) closeLightbox();
        });

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeLightbox();
        });

        // Color Mode changes
        const handleThemeChange = () => {
          container.querySelectorAll(".preset-panel picture").forEach((p) => {
            p.classList.add("loading");
            loadAndReveal(p);
          });
          if (overlay.classList.contains("active") && openedPicture) {
            const img = openedPicture.querySelector("img");
            if (img) lightboxImg.src = pickSrc(img);
          }
        };

        document.addEventListener("colorModeChange", handleThemeChange);
        window.matchMedia?.("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
          if (!localStorage.getItem("colorMode")) handleThemeChange();
        });

        // Init
        const presets = await fetchJSON("preset.json");
        if (presets) {
          items = await Promise.all(
            Object.entries(presets).map(async ([id, meta]) => {
              presetDetails[id] = (await fetchJSON(`preset/${id}.json`)) || {};
              const img = { light: `img/${id}@light.png`, dark: `img/${id}@dark.png`, base: `img/${id}.png` };
              const imageHTML = `<picture class="loading"><div class="preset-img-loader"></div><source data-srcset="${img.dark}" media="(prefers-color-scheme: dark)"><source data-srcset="${img.light}" media="(prefers-color-scheme: light)"><img loading="lazy" decoding="async" data-base="${img.base}" data-light="${img.light}" data-dark="${img.dark}"></picture>`;
              const authorHTML = meta.url ? `<a href="${meta.url}">${meta.author}</a>` : meta.author;
              const html = `<div class="preset-panel" data-preset="${id}"><div class="preset-info"><h2>${meta.name}</h2><p>By ${authorHTML}</p></div>${imageHTML}<p>${mdLinks(meta.description)}</p><div class="panel-actions"><button class="copy-btn"><i data-lucide="copy"></i>Copy</button><a class="download-btn" href="preset/${id}.json" download="baseline-${id}.json"><button><i data-lucide="download"></i></button></a></div></div>`;
              return { name: meta.name, id, meta, html, searchable: `${id} ${meta.name} ${meta.author || ""} ${meta.description || ""}`.toLowerCase() };
            }),
          );

          const q = new URLSearchParams(window.location.search).get("q");
          if (q) searchInput.value = q;
          updateFilterLabel();
          render();
        }
      });
    </script>
  </body>
</html>

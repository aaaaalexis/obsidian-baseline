<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baseline Marketplace</title>
    <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml" />

    <script>
      (() => {
        const saved = localStorage.getItem("colorMode");
        const mode = saved === "light" || saved === "dark" || saved === "auto" ? saved : "auto";
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const resolved = mode === "dark" || (mode === "auto" && prefersDark) ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", resolved);
        document.documentElement.setAttribute("data-theme-mode", mode);
      })();
    </script>

    <link rel="stylesheet" href="../shared/shared.css" />
    <link rel="stylesheet" href="marketplace.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />

    <script src="../shared/appearance.js" defer></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-38V3HD97K9"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-38V3HD97K9");
    </script>
  </head>
  <body>
    <div class="header" data-subtitle="Marketplace">
      <a class="link-btn" href="https://github.com/aaaaalexis/obsidian-baseline/blob/main/docs/marketplace/README.md"><i data-lucide="plus"></i>Submit preset</a>
    </div>
    <script src="../shared/header.js"></script>
    <div class="content">
      <div class="setting-container" title='Click the "Import" button in Style Settings to import copied style preset or color palette.'>
        <div class="setting">
          <div class="setting-sidebar">
            <div class="setting-search">
              <i data-lucide="search"></i>
              Search settings...
            </div>
            <div class="sidebar-section">
              <div class="sidebar-title">Community plugins</div>
              <div class="sidebar-link is-active">Style Settings</div>
            </div>
          </div>
          <div class="setting-content">
            <div class="setting-header">
              <div class="setting-search">
                <i data-lucide="search"></i>
                Search Style Settings...
              </div>
              <div class="setting-actions">
                <button>Import</button>
                <button>Export</button>
              </div>
            </div>
            <div class="setting-list">
              <div class="setting-item">
                <i data-lucide="chevron-right"></i>
                <div class="setting-item-name">Baseline</div>
                <div class="setting-item-actions"><i data-lucide="rotate-ccw"></i><i data-lucide="cloud-download"></i></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <p>Choose and copy your favorite style preset, then import into Style Settings.</p>
      <div class="preset-actions">
        <input type="search" class="preset-search" placeholder="Search marketplace..." />
        <button class="preset-search-btn" popovertarget="preset-search-menu"><i data-lucide="list-filter"></i></button>
      </div>
      <div class="menu" id="preset-search-menu" popover>
        <ul>
          <li class="is-info">
            <div class="info-description">Filter</div>
          </li>
          <li class="is-active" data-filter="preset"><i data-lucide="paintbrush"></i>Style Preset<i data-lucide="check"></i></li>
          <li class="is-active" data-filter="palette"><i data-lucide="palette"></i>Color Palette<i data-lucide="check"></i></li>
        </ul>
        <hr />
        <ul>
          <li class="is-info">
            <div class="info-description">Sort</div>
          </li>
          <li class="is-active" data-sort="new"><i data-lucide="calendar-arrow-down"></i>New → Old<i data-lucide="check"></i></li>
          <li data-sort="old"><i data-lucide="calendar-arrow-up"></i>Old → new<i data-lucide="check"></i></li>
          <li data-sort="a-z"><i data-lucide="arrow-down-a-z"></i>A → Z<i data-lucide="check"></i></li>
          <li data-sort="z-a"><i data-lucide="arrow-up-a-z"></i>Z → A<i data-lucide="check"></i></li>
        </ul>
      </div>
      <div class="panel-container"></div>
    </div>
    <div id="lightbox" popover>
      <img class="lightbox-img" />
      <p class="lightbox-title"></p>
    </div>

    <template class="preset-template">
      <div class="preset-panel" data-preset="" data-type="preset">
        <div class="preset-info">
          <h2></h2>
          <p>By <span class="preset-author"></span></p>
        </div>
        <picture class="loading">
          <div class="preset-img-loader"></div>
          <source media="(prefers-color-scheme: dark)" />
          <source media="(prefers-color-scheme: light)" />
          <img loading="lazy" decoding="async" />
        </picture>
        <p class="preset-description"></p>
        <div class="panel-actions">
          <button class="copy-btn" aria-label="Copy preset" title="Copy preset"><i data-lucide="copy"></i>Copy</button>
        </div>
      </div>
    </template>

    <template class="palette-template">
      <div class="preset-panel" data-preset="" data-type="palette">
        <div class="preset-info">
          <h2></h2>
          <p>By <span class="preset-author"></span></p>
        </div>
        <div class="palette-preview"></div>
        <p class="preset-description"></p>
        <div class="panel-actions">
          <button class="copy-btn" aria-label="Copy color palette" title="Copy color palette"><i data-lucide="copy"></i>Copy</button>
          <button class="palette-menu-btn" popovertarget="palette-menu" aria-label="Color palette options" title="Color palette options"><i data-lucide="chevron-down"></i></button>
        </div>
      </div>
      <div class="menu palette-menu" popover>
        <ul>
          <li class="is-info">
            <div class="info-title">Dynamic</div>
            <div class="info-description">Supports easy color scheme adjustments with automatic scheme generation in Style Settings.</div>
          </li>
          <li data-kind="dynamic" data-mode="light"><i data-lucide="sun"></i>Copy Light</li>
          <li data-kind="dynamic" data-mode="dark"><i data-lucide="moon"></i>Copy Dark</li>
          <hr />
          <li class="is-info">
            <div class="info-title">Static</div>
            <div class="info-description">True to original colors, individually set colors. Certain elements may not adapt. Same as legacy color scheme.</div>
          </li>
          <li data-kind="static" data-mode="light"><i data-lucide="sun"></i>Copy Light</li>
          <li data-kind="static" data-mode="dark"><i data-lucide="moon"></i>Copy Dark</li>
        </ul>
      </div>
    </template>

    <script src="https://unpkg.com/lucide@latest" onload="lucide.createIcons()"></script>
    <script src="extractor.js"></script>
    <script src="marketplace.js"></script>
  </body>
</html>

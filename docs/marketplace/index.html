    <div class="content">
      <div class="setting-container" title='Click the "Import" button in Style Settings to import copied style preset or color palette.'>
        <div class="setting">
          <div class="setting-sidebar">
            <div class="setting-search">
              <i data-lucide="search"></i>
              Search settings...
            </div>
            <div class="sidebar-section">
              <div class="sidebar-title">Community plugins</div>
              <div class="sidebar-link is-active">Style Settings</div>
            </div>
          </div>
          <div class="setting-content">
            <div class="setting-header">
              <div class="setting-search">
                <i data-lucide="search"></i>
                Search Style Settings...
              </div>
              <div class="setting-actions">
                <button>Import</button>
                <button>Export</button>
              </div>
            </div>
            <div class="setting-list">
              <div class="setting-item">
                <i data-lucide="chevron-right"></i>
                <div class="setting-item-name">Baseline</div>
                <div class="setting-item-actions"><i data-lucide="rotate-ccw"></i><i data-lucide="cloud-download"></i></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <p>Choose and copy your favorite style preset, then import into Style Settings.</p>
      <div class="preset-actions">
        <input type="search" class="preset-search" placeholder="Search marketplace..." />
        <button class="preset-search-btn" popovertarget="preset-search-menu"><i data-lucide="list-filter"></i></button>
      </div>
      <div class="menu" id="preset-search-menu" popover>
        <ul class="preset-search-filter">
          <li class="is-active" data-filter="preset"><i data-lucide="paintbrush"></i>Style Preset</li>
          <li class="is-active" data-filter="palette"><i data-lucide="palette"></i>Color Palette</li>
        </ul>
        <hr />
        <ul class="preset-search-sort">
          <li class="is-active" data-sort="new"><i data-lucide="calendar-arrow-down"></i>New → Old</li>
          <li data-sort="old"><i data-lucide="calendar-arrow-up"></i>Old to new</li>
          <li data-sort="a-z"><i data-lucide="arrow-down-a-z"></i>A → Z</li>
          <li data-sort="z-a"><i data-lucide="arrow-up-a-z"></i>Z → A</li>
        </ul>
      </div>
      <div class="panel-container"></div>
    </div>
    <div id="lightbox" popover>
      <img class="lightbox-img" />
      <p class="lightbox-title"></p>
    </div>

    <template class="preset-panel--preset">
      <div class="preset-panel" data-preset="" data-type="preset">
        <div class="preset-info">
          <h2></h2>
          <p>By <span class="preset-author"></span></p>
        </div>
        <picture class="loading">
          <div class="preset-img-loader"></div>
          <source media="(prefers-color-scheme: dark)" />
          <source media="(prefers-color-scheme: light)" />
          <img loading="lazy" decoding="async" />
        </picture>
        <p class="preset-description"></p>
        <div class="panel-actions">
          <button class="copy-btn" aria-label="Copy preset"><i data-lucide="copy"></i>Copy</button>
        </div>
      </div>
    </template>

    <template class="preset-panel--palette">
      <div class="preset-panel" data-preset="" data-type="palette">
        <div class="preset-info">
          <h2></h2>
          <p>By <span class="preset-author"></span></p>
        </div>
        <div class="palette-preview">
          <!-- To be implmented / Non-clickable, ignore for now -->
        </div>
        <p class="preset-description"></p>
        <div class="panel-actions">
          <button class="copy-btn" aria-label="Copy color palette"><i data-lucide="copy"></i>Copy</button>
          <button popovertarget="preset-panel-palette-menu" aria-label="Color palette options"><i data-lucide="chevron-down"></i></button>
        </div>
      </div>
      <div class="menu" id="preset-panel-palette-menu" popover>
        <ul>
          <li class="is-info">
            <div class="info-title">Dynamic</div>
            <div class="info-description">Supports easy color scheme adjustments with automatic scheme generation in Style Settings.</div>
          </li>
          <li><i data-lucide="sun"></i>Copy Light</li>
          <li><i data-lucide="moon"></i>Copy Dark</li>
          <hr />
          <li class="is-info">
            <div class="info-title">Static</div>
            <div class="info-description">True to original colors, individually set colors. Certain elements may not adapt. Same as legacy color scheme.</div>
          </li>
          <li><i data-lucide="sun"></i>Copy Light</li>
          <li><i data-lucide="moon"></i>Copy Dark</li>
        </ul>
      </div>
    </template>

    <script src="https://unpkg.com/lucide@latest" onload="lucide.createIcons()"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        // Utilities
        const $ = (sel, scope = document) => scope.querySelector(sel);
        const $$ = (sel, scope = document) => Array.from(scope.querySelectorAll(sel));
        const fetchJSON = (path) =>
          fetch(path)
            .then((r) => (r.ok ? r.json() : null))
            .catch(() => null);
        const mdLinks = (t) => (t ? t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>') : "No description available.");
        const isDark = () => localStorage.getItem("colorMode") === "dark" || window.matchMedia?.("(prefers-color-scheme: dark)").matches;
        const pickImageSrc = (img) => {
          const { light, dark, base } = img.dataset;
          return isDark() ? dark || light || base : light || dark || base;
        };

        const initImageLoader = (picture) => {
          const img = picture.querySelector("img");
          if (!img) return;
          const src = pickImageSrc(img);
          if (!src) return picture.classList.remove("loading");

          const loader = new Image();
          loader.onload = () => {
            img.src = src;
            requestAnimationFrame(() => {
              img.style.opacity = "1";
              picture.classList.remove("loading");
            });
          };
          loader.onerror = () => picture.classList.remove("loading");
          loader.src = src;
        };

        const setActive = (el, isActive) => {
          el.classList.toggle("is-active", isActive);
          if (!el.className) el.removeAttribute("class");
        };

        // Create Panel from Template
        const buildPanel = (item) => {
          const isPalette = item.type === "palette";
          const template = $(`.preset-panel--${isPalette ? "palette" : "preset"}`);
          if (!template) return null;

          const clone = template.content.cloneNode(true);
          const panel = clone.querySelector(".preset-panel");
          panel.dataset.preset = item.id;
          panel.dataset.type = item.type;

          clone.querySelector("h2").textContent = item.name;
          clone.querySelector(".preset-description").innerHTML = mdLinks(item.description);

          const authorEl = clone.querySelector(".preset-author");
          if (item.authorUrl) {
            const a = document.createElement("a");
            a.href = item.authorUrl;
            a.textContent = item.author;
            authorEl.replaceWith(a);
          } else {
            authorEl.textContent = item.author || "Unknown";
          }

          if (isPalette) {
            const preview = clone.querySelector(".palette-preview");
            item.colors?.forEach((hex) => {
              const swatch = document.createElement("div");
              swatch.className = "palette-color";
              swatch.style.backgroundColor = hex;
              preview.appendChild(swatch);
            });
          } else {
            const img = clone.querySelector("img");
            if (item.imageDark) {
              clone.querySelector('source[media*="dark"]').dataset.srcset = item.imageDark;
              img.dataset.dark = item.imageDark;
            }
            if (item.imageLight) {
              clone.querySelector('source[media*="light"]').dataset.srcset = item.imageLight;
              img.dataset.light = item.imageLight;
            }
            if (item.imageBase) img.dataset.base = item.imageBase;
          }

          return clone;
        };

        // UI Elements & State
        const container = $(".panel-container");
        const searchInput = $(".preset-search");
        const searchBtn = $(".preset-search-btn");
        const searchMenu = $("#preset-search-menu");
        const lightbox = $("#lightbox");
        const [lightboxImg, lightboxTitle] = [$(".lightbox-img", lightbox), $(".lightbox-title", lightbox)];

        let items = [],
          itemDetails = {},
          debounceTimer;
        const filterModes = ["new", "old", "a-z", "z-a"];
        const filterLabels = { new: "New → Old", old: "Old → New", "a-z": "A → Z", "z-a": "Z → A" };
        const typeLabels = { preset: "Style Preset Only", palette: "Color Palette Only" };
        const placeholders = {
          all: "Search style presets & color palettes...",
          preset: "Search style presets...",
          palette: "Search color palettes...",
        };
        const activeTypes = new Set(["preset", "palette"]);
        let currentFilter = 0;

        const refreshIcons = () => lucide.createIcons();
        const getActiveType = () => (activeTypes.size === 1 ? [...activeTypes][0] : null);
        const updateControls = () => {
          const activeType = getActiveType();
          const typesLabel = activeType ? typeLabels[activeType] : "All";
          const placeholderKey = activeType || "all";
          searchBtn.innerHTML = `<i data-lucide="list-filter"></i>${typesLabel} · ${filterLabels[filterModes[currentFilter]]}`;
          searchInput.placeholder = placeholders[placeholderKey];
          refreshIcons();
        };

        // Render List
        const render = () => {
          const query = searchInput.value.trim().toLowerCase();
          const mode = filterModes[currentFilter];

          let filtered = items.slice();
          if (mode === "new") filtered.reverse();
          else if (mode === "a-z") filtered.sort((a, b) => a.name.localeCompare(b.name));
          else if (mode === "z-a") filtered.sort((a, b) => b.name.localeCompare(a.name));

          filtered = filtered.filter((i) => activeTypes.has(i.type));
          if (query) filtered = filtered.filter((i) => i.searchable.includes(query));

          container.innerHTML = "";
          filtered.forEach((i) => {
            const el = buildPanel(i);
            if (el) container.appendChild(el);
          });

          refreshIcons();
          $$(".preset-panel[data-type='preset'] picture", container).forEach(initImageLoader);
        };

        // Handlers
        searchMenu?.addEventListener("click", (e) => {
          const filterItem = e.target.closest("[data-filter]");
          const sortItem = e.target.closest("[data-sort]");

          if (filterItem) {
            const type = filterItem.dataset.filter;
            if (!type) return;
            if (activeTypes.has(type) && activeTypes.size === 1) return;
            activeTypes.has(type) ? activeTypes.delete(type) : activeTypes.add(type);
            $$("[data-filter]", searchMenu).forEach((el) => setActive(el, activeTypes.has(el.dataset.filter)));
            updateControls();
            render();
            return;
          }

          if (sortItem) {
            const next = filterModes.indexOf(sortItem.dataset.sort);
            if (next === -1) return;
            currentFilter = next;
            $$("[data-sort]", searchMenu).forEach((el) => {
              const isActive = el.dataset.sort === filterModes[currentFilter];
              setActive(el, isActive);
            });
            updateControls();
            render();
          }
        });

        searchInput.addEventListener("input", () => {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => {
            const query = searchInput.value.trim();
            const url = new URL(window.location);
            query ? url.searchParams.set("q", query) : url.searchParams.delete("q");
            window.history.replaceState({}, "", url);
            render();
          }, 150);
        });

        container.addEventListener("click", (e) => {
          const btn = e.target.closest("button");
          const panel = e.target.closest(".preset-panel");
          const picture = e.target.closest("picture");

          if (panel && btn?.closest(".copy-btn")) {
            const id = panel.dataset.preset;
            const type = panel.dataset.type;
            const data = itemDetails[id];
            if (!data) return;

            navigator.clipboard.writeText(JSON.stringify(data, null, 2)).then(() => {
              const originalHtml = btn.innerHTML;
              btn.innerHTML = "Copied!";
              setTimeout(() => {
                btn.innerHTML = originalHtml;
                lucide.createIcons();
              }, 1000);
              window.gtag?.("event", `${type}_copy`, { [type]: id });
            });
          } else if (picture) {
            const img = picture.querySelector("img");
            if (img) {
              lightboxImg.src = pickImageSrc(img);
              lightboxTitle.textContent = panel.querySelector("h2")?.textContent || "";
              lightbox.showPopover();
            }
          }
        });

        // Lightbox - handles dismiss with click and Escape via Popover API
        lightbox?.addEventListener("click", (e) => {
          if (e.target === lightbox || e.target === lightboxImg) lightbox.hidePopover();
        });
        lightbox?.addEventListener("toggle", (e) => {
          document.body.classList.toggle("lightbox-active", e.newState === "open");
        });

        // Themes
        const updateImagesTheme = () => {
          container.querySelectorAll(".preset-panel[data-type='preset'] picture").forEach((p) => {
            p.classList.add("loading");
            initImageLoader(p);
          });
          if (lightbox?.matches(":popover-open")) {
            const img = lightbox.querySelector(".lightbox-img");
            if (img?.dataset.base) lightboxImg.src = pickImageSrc(img);
          }
        };
        document.addEventListener("colorModeChange", updateImagesTheme);
        window.matchMedia?.("(prefers-color-scheme: dark)").addEventListener("change", () => {
          if (!localStorage.getItem("colorMode")) updateImagesTheme();
        });

        // Init
        const manifest = await fetchJSON("preset.json");
        if (manifest) {
          items = await Promise.all(
            Object.entries(manifest).map(async ([id, meta]) => {
              const isPalette = meta.type === "palette";
              const details = (await fetchJSON(`preset/${id}.json`)) || {};
              itemDetails[id] = details;

              return {
                id,
                type: meta.type || "preset",
                name: meta.name,
                author: meta.author || "Unknown",
                authorUrl: meta.url || null,
                description: meta.description || "No description available.",
                colors: isPalette ? details.colors || [] : null,
                imageBase: !isPalette ? `img/${id}.png` : null,
                imageDark: !isPalette ? `img/${id}@dark.png` : null,
                imageLight: !isPalette ? `img/${id}@light.png` : null,
                searchable: `${id} ${meta.name} ${meta.author || ""} ${meta.description || ""}`.toLowerCase(),
              };
            }),
          );

          const initialQuery = new URLSearchParams(window.location.search).get("q");
          if (initialQuery) searchInput.value = initialQuery;
          updateControls();
          render();
        }
      });
    </script>
  </body>
</html>

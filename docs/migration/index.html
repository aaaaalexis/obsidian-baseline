<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baseline Migration Tool</title>
    <link rel="icon" href="../core/favicon.svg" type="image/svg+xml" />

    <script>
      (() => {
        const saved = localStorage.getItem("colorMode");
        const mode = saved === "light" || saved === "dark" || saved === "auto" ? saved : "auto";
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const resolved = mode === "dark" || (mode === "auto" && prefersDark) ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", resolved);
        document.documentElement.setAttribute("data-theme-mode", mode);
      })();
    </script>

    <link rel="stylesheet" href="../core/global.css" />
    <link rel="stylesheet" href="../core/settings.css" />
    <link rel="stylesheet" href="migration.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />

    <script src="../core/appearance.js" defer></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-38V3HD97K9"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-38V3HD97K9");
    </script>
  </head>
  <body>
    <div class="header">
      <h1 class="header-title">
        <a href=".."><i data-lucide="chevron-left"></i>Baseline for Obsidian</a><span>/</span>Migration
      </h1>
      <div class="header-actions">
        <a href="https://buymeacoffee.com/sevenaxis" aria-label="Support development" title="Support development">Support</a>
        <a href="https://github.com/aaaaalexis/obsidian-baseline" aria-label="View on GitHub" title="View on GitHub">GitHub</a>
        <button class="mode-switcher mod-invert" aria-label="Change appearance" title="Change appearance" data-mode="light"></button>
      </div>
    </div>

    <div class="content">
      <div class="content-mask"></div>
      <div class="setting-container" title='Click the "Export" on top or the cloud icon for selected theme to export your settings.'>
        <div class="setting">
          <div class="setting-sidebar">
            <div class="setting-search">
              <i data-lucide="search"></i>
              Search settings...
            </div>
            <div class="sidebar-section">
              <div class="sidebar-title">Community plugins</div>
              <div class="sidebar-link is-active">Style Settings</div>
            </div>
          </div>
          <div class="setting-content">
            <div class="setting-header">
              <div class="setting-search">
                <i data-lucide="search"></i>
                Search Style Settings...
              </div>
              <div class="setting-actions">
                <button>Import</button>
                <button>Export</button>
              </div>
            </div>
            <div class="setting-list">
              <div class="setting-item">
                <i data-lucide="chevron-right"></i>
                <div class="setting-item-name">Theme</div>
                <div class="setting-item-actions"><i data-lucide="rotate-ccw"></i><i data-lucide="cloud-download"></i></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="setting-description">Export your existing Style Settings, then paste here to migrate to Baseline-compatible settings.</div>
      <div class="panel-container">
        <div class="input-panel">
          <textarea
            class="prefs-input"
            placeholder='{
  "minimal-style@@bg1@@light": "#FFFFFF",
  "minimal-style@@tabs-style": "tabs-modern"
}


Supported themes:
- Minimal
- AnuPpuccin
- Border
- Sanctum
- Things 2

Last updated: 2025-09-09'
          ></textarea>
          <div class="panel-actions">
            <button class="clear-btn mod-invert">Clear</button>
          </div>
          <div class="warning-container"></div>
        </div>
        <div class="output-panel">
          <textarea class="prefs-output" disabled readonly></textarea>
          <div class="panel-actions">
            <button class="copy-btn mod-invert"><i data-lucide="copy"></i>Copy</button>
            <a class="download-btn link-btn mod-invert" href="#" download="baseline-style-settings.json">Download</a>
          </div>
          <div class="conflict-container"></div>
          <div class="unsupported-container"></div>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/lucide@latest" onload="lucide.createIcons()"></script>
    <script src="migration.js"></script>
  </body>
</html>
